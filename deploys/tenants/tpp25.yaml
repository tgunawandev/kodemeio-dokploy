tenant:
  code: tpp25
  name: "Pakerti 2025"
  short_name: "Pakerti 2025"
  domain: idtpp.com

# Exact copy of tpp-odoo-erp (import recipe / profile-erp / 4 workers), deployed
# on tpp-prod-05. Database tpp25_odoo_erp lives on the shared postgres (10.0.0.2,
# tpp-prod-01) — same topology as tpp-odoo-erp; the Odoo container runs on
# tpp-prod-05 and connects over the private network. Production-only; no staging,
# no React PWAs, no satellites (single ERP instance by design).

environments:
  production:
    server: tpp-prod-07
    dns_prefix: ""
    db_prefix: ""
    auto_deploy: false
  staging:
    # tpp25-odoo-erp-stg runs on tpp-prod-07 but had no manifest.
    server: tpp-prod-07
    dns_suffix: "-stg"
    db_suffix: "_stg"
    auto_deploy: true

odoo:
  - recipe: import
    short: erp
    description: "ERP — Import + Trading + Distribution (multi-company, 43 CVs)"
    workers: 4

# Filestore (attachment) backups — production only.
#
# volume MUST be the exact docker volume name on the host; tpp-prod-07 carries
# SIX *_odoo-filestore volumes and only this one is live.
# Measured 2026-08-08: 21,336 files / 6.5 GB.
#
# pinned_cron runs 15 min after the 03:05 UTC pg_dump, so there is always a
# filestore snapshot NEWER than the database dump it will be restored with.
filestore_backups:
  - short: erp
    volume: compose-index-back-end-bus-xbznq4_odoo-filestore
    database: tpp25_odoo_erp
    min_files: 19000
    pinned_cron: "20 3 * * *"
    bucket: hz-tpp-odoo-filestore
    server: tpp-prod-07
