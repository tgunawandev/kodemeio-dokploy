tenant:
  code: mac
  name: "Mandiri Agro"
  short_name: "MAC"
  domain: idtpp.com

environments:
  production:
    server: tpp-prod-02
    dns_prefix: ""
    db_prefix: ""
    auto_deploy: false
  staging:
    server: tpp-stg-01
    dns_suffix: "-stg"
    db_suffix: "_stg"
    auto_deploy: true

odoo:
  - recipe: erp
    short: erp
    description: "ERP (accounting, sales, purchase, inventory, BI)"
    workers: 2
    # `erp` is the unified mobile workspace (@kodemeio/erp) that contains
    # bia, eam, lfa, mrp, sfa, wms as runtime-discovered modules.
    apps: [erp]
  - recipe: hrms
    short: hrms
    description: "HRMS (employees, attendance, payroll, leaves, expenses)"
    workers: 2
    apps: [hrm]

web:
  careers: true

services:
  # notify: shared via kod-infra-notify (notify.kodeme.io). MAC origins are
  # registered in env/production/.env.kod-infra-notify ALLOWED_ORIGINS.
  redis: true

# Hermes — RETIRED 2026-09-07. The agent ran on tpp-prod-05, and that server no
# longer exists: Hetzner has six servers for this account and tpp-prod-05 is not
# among them, while Dokploy still carried an `active` record for it. The agent
# had been in `error` ever since, because its host was deleted out from under it.
#
# Retired rather than repointed, by decision — there was no replacement running
# anywhere and nobody had missed it.
#
# The comment that used to sit here claimed "mac-mm.idtpp.com actually resolves
# to 178.104.171.122 (tpp-prod-05), not tpp-stg-01". That is no longer true and
# is worth recording as wrong rather than deleting silently: mac-mm.idtpp.com now
# resolves to 5.223.69.142 (tpp-prod-06, Singapore) and answers HTTP 200, because
# the migration in ops/runbooks/mattermost-sg-migration.md completed. The live
# service is mac-infra-mattermost-sg-prod, which is `done` and backed up.
#
# To bring a MAC agent back, re-add a `hermes:` block here pointing at a server
# that exists — tpp-prod-06 keeps the original "co-located with mac-mm" intent —
# and regenerate. Do NOT reuse the deleted instance name blindly; check what
# Dokploy still holds first.

# volume MUST be the exact docker volume name on tpp-prod-02: Dokploy names
# compose volumes {appName}_{volume} and ignores COMPOSE_PROJECT_NAME, so decoy
# filestore volumes sit beside the live ones. Read off Dokploy appName 2026-08-15.
#
# instance_short is REQUIRED here: mac is the first tenant with two production
# filestore backups, and without it both entries generate the same instance and
# env filename (see deploys/tests/test_gen_filestore_backup.py).
#
# min_files MEASURED 2026-08-15 from the first snapshot of each volume, which is
# the only way to learn it (no kctl-dokploy exec/ssh; RPC reaches ORM methods
# only; direct SSH to prod is forbidden). Set to 90% of the real count.
#   erp  : 1925 files -> 1732
#   hrms :  241 files ->  216
#
# The provisional guesses (1500 / 650) were derived from ir_attachment distinct
# blobs and the hrms one was WRONG -- the guard refused the first hrms snapshot
# with "241 files, floor is 650", which is the guard working as designed.
# hrms holds 241 files against 852 DB-referenced blobs; that is NOT missing data:
# 852 distinct blobs total 40 MB while the volume holds 45 MB, so the big objects
# (20 ir.ui.view asset bundles = 24 MB) are present and the ~611 absent ones are
# overwhelmingly module-shipped payment.method icons at ~2 kB each (374 blobs =
# 723 kB total). Never raise a floor to make a guard pass -- measure, then set.
#
# pinned_cron runs after each nightly pg_dump (mac_odoo_erp 01:05,
# mac_odoo_hrms 01:10 UTC) so a filestore snapshot is always NEWER than the
# database dump it will be restored alongside, never older.
filestore_backups:
  - short: erp
    instance_short: erp
    volume: compose-calculate-neural-matrix-phtlsl_odoo-filestore
    database: mac_odoo_erp
    min_files: 1732
    pinned_cron: "20 1 * * *"
    bucket: hz-mac-odoo-filestore
    server: tpp-prod-02

  - short: hrms
    instance_short: hrms
    volume: compose-bypass-cross-platform-interface-j4al4h_odoo-filestore
    database: mac_odoo_hrms
    min_files: 216
    pinned_cron: "25 1 * * *"
    bucket: hz-mac-odoo-filestore
    server: tpp-prod-02
