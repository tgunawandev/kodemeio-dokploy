kind: instance
extends: ../../bases/infra.yaml

instance:
  name: kod-infra-postgres
  description: "Shared PostgreSQL 16 database"

project: apps
environment: production
# Was inheriting the infra base's stale `server: kodeme-service` default
# (never overridden here before). The live kod postgres instance actually
# now runs on kod-ovh-01. This record follows the current hosting inventory.
server: kod-ovh-01

source_overrides:
  type: github
  owner: tgunawandev
  repo: kodemeio-postgres
  branch: main
  compose_path: ./docker-compose.prod.yml

env_file: ../../env/production/.env.kod-infra-postgres

# Wave 0 row 0.3 (S0): bind Postgres, PgBouncer and the exporter to
# the host's loopback only. kodemeio-postgres' compose publishes
# ${POSTGRES_PORT:-5432}:5432, ${PGBOUNCER_PORT:-6432}:6432 and
# ${POSTGRES_EXPORTER_PORT:-9187}:9187 -- i.e. 0.0.0.0 by default, and Docker's
# published ports bypass ufw. The compose file is shared with other estates, so
# the fix lives here, not there. Services reach the database over
# dokploy-network; operators use an SSH tunnel to 127.0.0.1 (kctl-pg).
# Checked by `ops/scripts/s0_postgres.py ports`; applying it is a
# founder redeploy (ops/runbooks/wave0-s0.md, S0-3).
env_overrides:
  POSTGRES_PORT: "127.0.0.1:5432"
  PGBOUNCER_PORT: "127.0.0.1:6432"
  POSTGRES_EXPORTER_PORT: "127.0.0.1:9187"

# Native backup jobs are managed directly in Dokploy. The installed manifest
# backup phase does not forward the required database-user/service fields; this
# block records the schedule and retention, rather than proving replay support.
backup:
  destination: kodemeio-s3-backups
  type: postgres
  schedule: "0 3 * * *"
  prefix_template: "{instance_name}"
  keep_latest: 14
