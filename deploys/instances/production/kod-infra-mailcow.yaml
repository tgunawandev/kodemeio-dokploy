kind: instance
type: infrastructure

instance:
  name: kod-infra-mailcow
  description: "Mailcow mail server (kodeme.io) — Traefik-terminated web UI, direct host ports for mail"

project: apps
environment: production
server: kod-ovh-01

# Standalone (no `extends: ../../bases/infra.yaml`): the infra base inherits a
# postgres backup block, which does not apply to a mailcow (MariaDB) stack and
# would fail every deploy (see CLAUDE.md, "backup: {} does not disable anything").
source:
  type: github
  owner: tgunawandev
  repo: kodemeio-mailcow
  branch: main
  compose_path: ./docker-compose.prod.yml
# mailcow-dockerized is a git submodule of the repo; the compose `include`s it.
enable_submodules: true
auto_deploy: false

domain:
  host: mail.kodeme.io
  port: 8080
  service: nginx-mailcow
  https: true
  cert: letsencrypt

healthcheck:
  path: /
  port: 8080
  expected_status: 200
  timeout: 300
  interval: 10

env_file: ../../env/production/.env.kod-infra-mailcow
env_defaults:
  TZ: "Asia/Jakarta"
env_overrides:
  MAILCOW_HOSTNAME: mail.kodeme.io
  COMPOSE_PROJECT_NAME: kod-infra-mailcow
  TZ: Asia/Jakarta

# Backups: only two volumes here cannot be rebuilt — the mail spool and the
# mailcow database (redis/rspamd/clamd/sogo caches and the vmail index all
# regenerate). Dokploy names compose volumes {appName}_{volume} and appName is
# generated for this service, so the exact host names were read from
# `docker volume ls` on kod-ovh-01 after the 2026-10-10 deployment and must be
# re-read if the compose service is ever recreated under a new appName.
volume_backups:
  - service: dovecot-mailcow
    volume: compose-program-digital-application-k6rdk6_vmail-vol-1
    destination: kodemeio-s3-backups
    prefix: kod-infra-mailcow/vmail
    cron_schedule: "0 2 * * *"
    keep_latest: 7
  - service: mysql-mailcow
    volume: compose-program-digital-application-k6rdk6_mysql-vol-1
    destination: kodemeio-s3-backups
    prefix: kod-infra-mailcow/mysql
    cron_schedule: "0 2 * * *"
    keep_latest: 7
