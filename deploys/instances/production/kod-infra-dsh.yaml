kind: instance
extends: ../../bases/infra.yaml

instance:
  name: kod-infra-dsh
  description: "DeepSeek Harness Web UI — isolated V4.1 Flash coding agent, gated by Authentik forward-auth"

project: apps
environment: production
# kod-prod-02 runs its own remote Authentik proxy outpost (the `kod-dsh-outpost`
# compose), so the Traefik forward-auth middleware here reaches it over
# dokploy-network in ONE hop. That hop count is the whole point: routing
# forward-auth through the public auth.kodeme.io inserts a second Traefik that
# rewrites X-Forwarded-Host to auth.kodeme.io, and the outpost identifies the
# application from that header — so it can never match the provider and 404s,
# making the domain unreachable. See kodemeio-dsh/outpost/.
server: kod-prod-02

source_overrides:
  owner: tgunawandev
  repo: kodemeio-dsh
  branch: main
  compose_path: ./docker-compose.prod.yml

dns:
  zone: kodeme.io
  name: dsh

domain:
  host: dsh.kodeme.io
  port: 8080
  service: gateway
  https: true
  cert: letsencrypt

env_file: ../../env/production/.env.kod-infra-dsh
env_overrides:
  COMPOSE_PROJECT_NAME: kod-infra-dsh
  # Not a secret. The gateway's Traefik forward-auth label interpolates this.
  # Internal dokploy-network alias of the remote outpost on kod-prod-02, used
  # for the per-request auth subrequest. It must NOT be the public name:
  # reaching the outpost over https://auth.kodeme.io adds a proxy hop that
  # rewrites X-Forwarded-Host, so the outpost cannot match the provider and
  # 404s. Matches the live Dokploy value.
  #
  # The browser-facing login redirect is a separate setting — the outpost's own
  # `authentik_host_browser`, which must be https://auth.kodeme.io (empty makes
  # it emit http://0.0.0.0:9000 and login becomes impossible).
  AUTHENTIK_HOST: http://authentik-outpost:9000

# SSO is enforced at the Traefik layer by a forward-auth middleware defined in
# the repo's docker-compose.prod.yml (calls
# ${AUTHENTIK_HOST}/outpost.goauthentik.io/auth/traefik). Authentik-side wiring:
# Proxy Provider 'dsh-harness' (forward_single) bound to the REMOTE outpost
# `kod-prod-02-proxy` (pk 14afe6ba-be14-493a-944f-44f6329dadd9), which is the
# same outpost that gates design.kodeme.io. Note that a newly bound provider
# does not take effect until that outpost container is restarted — it reads its
# configuration once at boot and then serves from cache.
#
# The gateway additionally fails closed: Caddy requires BOTH the outpost's
# X-authentik-username header and an X-Gateway-Secret header injected by our own
# `headers` middleware, which overwrites any client-supplied value. That matters
# because a Traefik router naming a middleware that does not exist is dropped,
# and Dokploy's priority-30 domain router then serves the app directly — without
# the secret, an anonymous caller could simply send X-authentik-username itself
# and be redirected to /?token=<bootstrap token>. GATEWAY_AUTH_SECRET is
# required and lives in .env.kod-infra-dsh, never in Git.
#
# /healthz is deliberately excluded from the gated router so external monitoring
# reaches it ungated; it proxies to Harness's own 401 and exposes nothing.

healthcheck:
  path: /healthz
  port: 8080
  expected_status: 200
  timeout: 60
  interval: 30

backup:
  destination: kodemeio-s3-backups
  type: volume
  source: compose-quantify-optical-application-ggw4zk_dsh-home
  schedule: "0 3 * * *"
  prefix_template: "{instance_name}-home"
  keep_latest: 14
