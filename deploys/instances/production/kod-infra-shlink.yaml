# kodemeio-dokploy/deploys/instances/production/kod-infra-shlink.yaml
kind: instance
extends: ../../bases/shlink.yaml

instance:
  name: kod-infra-shlink
  description: "Shlink — self-hosted URL shortener"

project: kod
server: kod-hzc-01

source_overrides:
  repo: kodemeio-shlink
  compose_path: ./docker-compose.prod.yml

domain:
  host: s.kodeme.io
  port: 8080
  service: shlink
  https: true
  cert: letsencrypt
  cloudflare_proxied: true   # Cloudflare caching fine for redirects

dns:
  zone: kodeme.io
  name: s
  type: A
  proxied: true
  # content auto-resolved from server IP via Gate 1 validation

env_file: ../../env/production/.env.kod-infra-shlink
