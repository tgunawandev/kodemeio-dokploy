kind: instance
# Deliberately NOT `extends: ../../bases/infra.yaml`. merge_manifests() keeps
# the base's backup block whenever the instance's is None, so `backup: null`
# still inherits the postgres dump phase and fails on every deploy
# ("Destination 'kodemeio-s3-backups' not found"). This compose has no
# database: the `nextcloud` DB lives in tpp-infra-postgres, which carries its
# own per-database backup entry (25 2 * * *). The three things the base
# provided (type, healthcheck, TZ) are inlined below.
type: infrastructure

instance:
  name: tpp-infra-nextcloud
  description: "TPP Nextcloud — cloud storage on Hetzner S3 (tpp-nextcloud) with Authentik SSO"

project: tpp
environment: production
# tpp-prod-04 (cpx42, 15G): 1G used / 10 containers on 2026-09-09 versus
# tpp-prod-01 at 17/22G with 62 containers. Private-network reach from
# 10.0.0.6 to tpp-infra-postgres at 10.0.0.2:5432 verified before choosing.
# DNS record nextcloud.idtpp.com -> 178.104.169.250 (tpp-prod-04 public).
server: tpp-prod-04

source:
  type: github
  owner: tgunawandev
  repo: kodemeio-nextcloud
  branch: main
  compose_path: ./docker-compose.prod.yml

dns:
  zone: idtpp.com
  name: nextcloud

domain:
  host: nextcloud.idtpp.com
  port: 80
  service: nextcloud
  https: true
  cert: letsencrypt

# First boot installs Nextcloud against S3 + Postgres; allow well over the
# base's 60s before declaring the deploy dead.
healthcheck:
  path: /status.php
  port: 80
  expected_status: 200
  timeout: 300
  interval: 10

env_file: ../../env/production/.env.tpp-infra-nextcloud

env_defaults:
  TZ: "Asia/Jakarta"

env_overrides:
  COMPOSE_PROJECT_NAME: tpp-infra-nextcloud
  TZ: Asia/Jakarta

# Post-deploy manual steps (not handled by pipeline) — see
# kodemeio-nextcloud/docs/deploy.md:
#  1. kctl-pg -p idtpp: role + db `nextcloud` on tpp-infra-postgres
#  2. kctl-hz -p idtpp s3 mb tpp-nextcloud (+ versioning, lifecycle 30d)
#  3. kctl-mailcow -p idtpp mailboxes add nextcloud idtpp.com
#  4. kodemeio-nextcloud/scripts/setup-authentik.sh → OIDC_CLIENT_ID/SECRET in env
#  5. kctl-cf -p idtpp records create A nextcloud → tpp-prod-04 (preflight needs it)
#  6. On tpp-prod-04: make post-install && make oidc && make health
