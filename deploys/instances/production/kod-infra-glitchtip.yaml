kind: instance
type: infrastructure
instance:
  name: kod-infra-glitchtip
  description: Kodeme error tracking with native read-only SENTINEL MCP
project: apps
environment: production
server: kod-ovh-01
auto_deploy: false
source:
  type: github
  owner: tgunawandev
  repo: kodemeio-glitchtip
  branch: feat/kodeme-ovh
  compose_path: ./docker-compose.kodeme.yml
domain:
  host: glitchtip.kodeme.io
  port: 8000
  service: glitchtip
  https: true
  cert: letsencrypt
healthcheck:
  path: /_health/
  port: 8000
  expected_status: 200
  timeout: 20
  start_period: 180
env_file: ../../env/production/.env.kod-infra-glitchtip-ovh
env_overrides:
  COMPOSE_PROJECT_NAME: kod-infra-glitchtip
