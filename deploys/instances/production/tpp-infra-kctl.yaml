kind: instance
extends: ../../bases/infra.yaml

instance:
  name: tpp-infra-kctl
  description: "kctl toolbox — execution host for all scheduled kctl-* jobs (replaces xyOps and Ofelia)"

project: tpp
environment: production
# Same host as the xyOps conductor it replaces. tpp-prod-04 is the only host
# in the estate with no production co-tenancy.
server: tpp-prod-04

source_overrides:
  type: github
  owner: tgunawandev
  repo: kodemeio-skills
  branch: main
  compose_path: compose/toolbox.yml

env_file: ../../env/production/.env.tpp-infra-kctl

env_overrides:
  COMPOSE_PROJECT_NAME: tpp-infra-kctl
  TZ: Asia/Jakarta

# No dns/domain block on purpose: the toolbox has no HTTP surface, publishes
# no ports, and takes no Traefik route. Dokploy schedules reach it by
# `docker exec`, not over the network.
#
# TWO PHASES FAIL ON EVERY DEPLOY OF THIS APP, BY DESIGN. Both are
# kctl-dokploy gaps, not misconfiguration here, and both are tracked as fixes
# in Task 8 of the migration plan. Recording them explicitly so nobody spends
# an afternoon rediscovering it -- and so a NEW failure is still visible:
#
#   verify  "Healthcheck timed out: unexpected status 404"
#           phase_verify unconditionally polls {scheme}://{host}{path}. With
#           no domain block, host falls back to localhost, and this app serves
#           no HTTP at all. There is no port-0 or skip escape in the phase.
#
#   backup  "Destination '' not found"
#           merge_manifests does `instance.backup if instance.backup is not
#           None else base.backup`, so `backup: {}` is a BackupConfig with an
#           empty destination -- it WINS over the base rather than disabling
#           the phase, and phase_backup only skips when the value is None.
#           There is currently no way to disable an inherited backup config.
#           (kodemeio-xyops carries the same comment claiming `{}` disables
#           it; that is wrong -- its deploy reports the same failed phase.)
#
# This app genuinely needs no backup: its entire content is a pinned image
# plus env, both reproducible from git.
backup: {}

# Every command is a bare `jobrun <name>`. Dokploy passes a schedule's command
# to a shell WITHOUT escaping, so ' ( ) < > | & ; and $ kill the run before it
# produces any output -- and no alert, because Dokploy has no failure
# notification for scheduled jobs. Arguments, quoting and secret guards all
# live in /opt/kctl/jobs/<name>.sh inside the pinned image.
#
# Alarm ordering is deliberate: these land BEFORE the 06:50/07:00 reports so a
# stale backup is known before the business report goes out. Preserve it.
schedules:
  - {name: backup-tpp,      cron: "0 5 * * *",  command: "jobrun backup-tpp",      service: kctl, shell: sh, timezone: Asia/Jakarta}
  - {name: backup-tpp25,    cron: "10 5 * * *", command: "jobrun backup-tpp25",    service: kctl, shell: sh, timezone: Asia/Jakarta}
  - {name: backup-mac,      cron: "20 5 * * *", command: "jobrun backup-mac",      service: kctl, shell: sh, timezone: Asia/Jakarta}
  - {name: backup-mac-hrms, cron: "30 5 * * *", command: "jobrun backup-mac-hrms", service: kctl, shell: sh, timezone: Asia/Jakarta}

  # Offsite copy of the Hetzner S3 backups to Backblaze B2 (tpp-prod-backup,
  # mac-prod-backup), for when Hetzner itself is down. Logic and reasoning:
  # kodemeio-skills docker/lib/b2.sh.
  #
  # Mirrors run every 2h, tpp on even hours and mac on odd, so the two never
  # share the container. Both skip 06:00-08:59: rclone can hold ~600 MB, and
  # the 06:50/07:00/08:00 reports need the toolbox's 1G to themselves.
  # A mirror caps itself at 600s and resumes on the next run, so the initial
  # ~136 GB seed spreads over several runs instead of being killed by jobrun.
  #
  # The b2-fresh-* alarms are what make a silent mirror visible. They sit with
  # the other backup alarms, before the reports, for the same reason.
  - {name: b2-mirror-tpp, cron: "45 0,2,4,10,12,14,16,18,20,22 * * *",  command: "jobrun b2-mirror-tpp", service: kctl, shell: sh, timezone: Asia/Jakarta}
  - {name: b2-mirror-mac, cron: "45 1,3,5,9,11,13,15,17,19,21,23 * * *", command: "jobrun b2-mirror-mac", service: kctl, shell: sh, timezone: Asia/Jakarta}
  - {name: b2-fresh-tpp,  cron: "40 5 * * *", command: "jobrun b2-fresh-tpp", service: kctl, shell: sh, timezone: Asia/Jakarta}
  - {name: b2-fresh-mac,  cron: "45 5 * * *", command: "jobrun b2-fresh-mac", service: kctl, shell: sh, timezone: Asia/Jakarta}

  # Business reports. `catchup: true` from the xyOps events is dropped: Dokploy
  # has no equivalent, and the watchdog plus a deliberate `schedules run`
  # re-fire beats automatically mailing a stale report hours late.
  #
  # report-weekly mails REPORT_TEAM, matching Ofelia. The xyOps event mails
  # only the owner -- shipping that would have silently stopped the team's
  # weekly report the moment Ofelia was retired.
  - {name: report-selfcheck, cron: "50 6 * * *", command: "jobrun report-selfcheck", service: kctl, shell: sh, timezone: Asia/Jakarta}
  - {name: report-daily,     cron: "0 7 * * *",  command: "jobrun report-daily",     service: kctl, shell: sh, timezone: Asia/Jakarta}
  - {name: report-weekly,    cron: "0 8 * * 1",  command: "jobrun report-weekly",    service: kctl, shell: sh, timezone: Asia/Jakarta}

# The 10 maintenance jobs are NOT here: every one invokes a command that does
# not exist. See Task 4 of
# docs/superpowers/plans/2026-08-31-xyops-to-dokploy-migration.md.
#
# This deploy must prove the container comes up, `docker exec` resolves, and
# jobrun sees its secrets BEFORE anything is scheduled against it. A schedule
# pointing at a container Dokploy cannot resolve fails silently and forever --
# that is exactly how 14 Odoo schedules stayed dead for five months.
#
# When they are added, every command must be a bare `jobrun <name>`: Dokploy
# passes a schedule's command to a shell without escaping, so ' ( ) < > | & ;
# and $ all kill the run before it produces any output.
