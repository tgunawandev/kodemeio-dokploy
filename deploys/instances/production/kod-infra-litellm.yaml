kind: instance
# Deliberately NOT `extends: ../../bases/infra.yaml`.
#
# CLAUDE.md ("backup: {} and backup: {enabled: false} DO NOT DISABLE
# ANYTHING"): merge_manifests() takes the BASE's backup block whenever the
# instance's own `backup` is None -- so under `extends`, not even
# `backup: null` disables the infra base's postgres-dump phase, which would
# fail every deploy with "Destination '' not found". Placement B's database
# lives on kod postgres (kod-infra-postgres.yaml's SERVICE_DATABASES; that
# instance's own dump covers it); placement A's co-located `litellm-db`
# container is NOT covered by any backup yet -- Wave 0's
# ops/backup-inventory.kod.yaml planned item `litellm-db` must be re-added
# as a pg-db item naming it before real spend data matters. The documented fix for "a compose with no
# database" is to drop `extends` and inline the three things the base
# otherwise supplies (type, healthcheck, TZ) -- done below. With no `extends`,
# `backup` is simply never set, defaults to None, and orchestrator.py's
# phase_backup() skips it correctly.
type: infrastructure

instance:
  name: kod-infra-litellm
  description: "LiteLLM gateway -- metered, budgeted, no-prompt-storage front door for every Teracorp agent/factory model call"

project: kod
environment: production
# FOUNDER DECISION (kodemeio-llmlite docs/runbook-production.md Step 1,
# decision table) -- two supported placements:
#   A. co-located on dsh's host (RECOMMENDED): `server: kod-prod-02` (dsh's
#      host per kod-infra-dsh.yaml -- confirm the live host by IP), env
#      COMPOSE_PROFILES=colocated + LITELLM_DB_PASSWORD, DATABASE_URL
#      ...@litellm-db:5432/litellm, AUTHENTIK_HOST=http://authentik-outpost:9000.
#      dsh reaches LiteLLM over kod-llm-upstream with no CDN hop.
#   B. shared kod postgres: `server: abc-prod-02` (design D2),
#      DATABASE_URL ...@kod-infra-postgres:5432/litellm -- that alias only
#      resolves on abc-prod-02. dsh then goes through Cloudflare-proxied
#      llm.kodeme.io (permanent CDN-SNI residual risk).
# Defaults to A, consistent with env_overrides COMPOSE_PROFILES=colocated below.
# Choosing B means changing BOTH this line and that override (runbook Step 1).
server: kod-prod-02

# A plain `source:` block, not `source_overrides:` -- source_overrides is only
# applied by merge_manifests() during an `extends` resolve, and this manifest
# deliberately carries none (see the note above `type: infrastructure`). A
# standalone manifest is loaded and used as-is (load_and_resolve()), so
# source_overrides here would be silently ignored.
source:
  type: github
  owner: tgunawandev
  repo: kodemeio-llmlite
  branch: main
  compose_path: ./docker-compose.prod.yml

dns:
  zone: kodeme.io
  name: llm

domain:
  host: llm.kodeme.io
  port: 4000
  service: litellm
  https: true
  cert: letsencrypt

# Liveness only: this HTTP probe compares the status code, and
# /health/readiness returns HTTP 200 even during a Postgres outage on this
# pinned image (spec §1) -- only the body's `db` field changes. The DB check
# lives in docker-compose.prod.yml's own container healthcheck (python3,
# asserts db == "connected"; final-review fix C1 -- the image has no
# wget/curl) and in the runbook's Gatus/uptime check.
healthcheck:
  path: /health/liveliness
  port: 4000
  expected_status: 200
  timeout: 30
  interval: 30

env_file: ../../env/production/.env.kod-infra-litellm

env_defaults:
  TZ: "Asia/Jakarta"

env_overrides:
  COMPOSE_PROJECT_NAME: kod-infra-litellm
  # Fallback default matching the runbook's recommended placement A
  # (co-located, docs/runbook-production.md Step 1): starts the compose's
  # own litellm-db under the `colocated` profile even if the gitignored
  # env_file forgets to set it. env_overrides beats env_file (highest
  # priority — see kctl-dokploy's core/deploy/orchestrator.py), so switching
  # to placement B (shared kod postgres, abc-prod-02) means editing THIS
  # line, not the env_file: delete it (or set it to an empty string) here,
  # following kod-infra-plane-tpp.yaml:30's COMPOSE_PROFILES pattern.
  COMPOSE_PROFILES: colocated

# Post-deploy (not handled by the pipeline -- see docs/runbook-production.md
# in kodemeio-llmlite for the full founder-gated sequence):
#  1. Placement B only: add a `litellm` entry to kod postgres's
#     SERVICE_DATABASES and provision it.
#  2. Put LITELLM_MASTER_KEY / DATABASE_URL / DEEPSEEK_API_KEY /
#     OPENROUTER_API_KEY / ANTHROPIC_API_KEY (placement A also
#     COMPOSE_PROFILES / LITELLM_DB_PASSWORD / AUTHENTIK_HOST) into the
#     gitignored env_file + 1Password; `deploy apply` pushes it (never git).
#  3. Authentik forward-auth (Proxy Provider + Application) for the gated
#     Traefik router defined in kodemeio-llmlite's own docker-compose.prod.yml
#     -- see that file's comments for the AUTHENTIK_HOST one-hop gotcha.
#  4. `scripts/reconcile_keys.py --apply --url https://llm.kodeme.io` to create
#     the kido/vision/dsh/friday virtual keys from config/keys.yaml.
#  5. Switch VISION's vision auxiliary and dsh over, then remove the real
#     DeepSeek key from dsh's env (VISION keeps OPENROUTER_API_KEY until its
#     main model is routed through LiteLLM -- runbook item F1).
# The dsh containment (runbook Step 14) is independent of all of this and
# runs first.
