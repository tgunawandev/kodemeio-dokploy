kind: instance
extends: ../../bases/infra.yaml

instance:
  name: kod-infra-authentik
  description: "Authentik SSO/Identity Provider (embedded Postgres)"

project: kod
environment: production
server: kod-hzc-01    # kod: Dokploy + Immich + Authentik (founder, 2026-10-05); was kod-prod-03-data (deleted)

source_overrides:
  owner: tgunawandev
  repo: kodemeio-authentik
  branch: main
  compose_path: ./docker-compose.embedded.yml

domain:
  host: auth.kodeme.io
  port: 9000
  service: server
  https: true
  cert: letsencrypt

env_file: ../../env/production/.env.kod-infra-authentik
