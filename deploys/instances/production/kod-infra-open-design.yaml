kind: instance
extends: ../../bases/infra.yaml

instance:
  name: kod-infra-open-design
  description: "OpenDesign — design runtime for coding agents, gated by Authentik forward-auth"

project: apps
environment: production
# kod-prod-02 hosts the Authentik outpost this service's forward-auth middleware
# calls. An outpost is required because routing through the public
# auth.kodeme.io adds a proxy hop whose Traefik rewrites X-Forwarded-Host, and
# the outpost identifies the application from that header — it then 404s and the
# service is unreachable. One hop keeps the header intact.
server: kod-prod-02

source_overrides:
  owner: tgunawandev
  repo: kodemeio-open-design
  branch: main
  compose_path: ./docker-compose.prod.yml

dns:
  zone: kodeme.io
  name: design

domain:
  host: design.kodeme.io
  port: 7456
  service: open-design
  https: true
  cert: letsencrypt

env_file: ../../env/production/.env.kod-infra-open-design
env_overrides:
  # Not secret. The compose's forward-auth label interpolates this.
  AUTHENTIK_HOST: http://authentik-outpost:9000

# The compose gates EVERY path on this host, /api/health included, so an
# unauthenticated probe now gets a 302 to auth.kodeme.io rather than 200.
#
# 302 is the correct expected status: it asserts the gate is actually working.
# A dropped or mis-named forward-auth middleware would let the request reach the
# daemon, which answers 401 without its bearer — so this probe fails loudly on
# exactly the misconfiguration that would otherwise expose the service.
#
# This checks the edge, not the app. The app's own liveness is covered by the
# container healthcheck, which probes 127.0.0.1:7456/api/health inside the
# container and never traverses Traefik.
healthcheck:
  path: /api/health
  port: 7456
  expected_status: 302
  timeout: 60
  interval: 30
