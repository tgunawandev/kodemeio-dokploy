# Fleet maintenance fallback — one per Dokploy server.
# Design: docs/superpowers/specs/2026-09-08-maintenance-page-design.md
#
# Serves a branded 503 maintenance page for any host whose application is down,
# instead of Traefik's bare `404 page not found`. Deployed once per server; it
# then covers every domain on that server, present and future.
#
# ─────────────────────────────────────────────────────────────────────────────
# 🔴 NEVER add a `ports:` mapping here. Traefik reaches this container over
#    dokploy-network. A published :80/:443 would contend with Traefik for the
#    host ports and could take every site on the server down.
#
# 🔴 NEVER give this app a domain in Dokploy. It must own no Host router.
#    Its two routers below are catch-all at priority 1, so they lose to every
#    real app (Dokploy's Host routers are priority 30, derived from rule length)
#    and win only when that app's container — and therefore its router — is gone.
#
# 🔴 NEVER remove the explicit `priority=1`. Traefik would then derive priority
#    from rule length: `HostRegexp(`.+`)` is 18, still under 30, so a real app
#    stays safe — but the margin becomes accidental instead of stated.
#
# 🔴 No `$` may appear in the config blocks below. Compose interpolates `$var`
#    in inline config content, so an nginx variable would be eaten silently.
#    The nginx config is deliberately written without variables.
# ─────────────────────────────────────────────────────────────────────────────

services:
  maintenance:
    image: nginx:1.27-alpine
    restart: unless-stopped
    networks:
      - dokploy-network
    configs:
      - source: maintenance_nginx
        target: /etc/nginx/conf.d/default.conf
      - source: maintenance_html
        target: /usr/share/nginx/html/maintenance.html
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      - "traefik.http.services.kodemeio-maintenance.loadbalancer.server.port=80"
      # Catch-all fallback, HTTP. Priority 1 — loses to every real router.
      - "traefik.http.routers.kodemeio-maintenance-web.rule=HostRegexp(`.+`)"
      - "traefik.http.routers.kodemeio-maintenance-web.priority=1"
      - "traefik.http.routers.kodemeio-maintenance-web.entrypoints=web"
      - "traefik.http.routers.kodemeio-maintenance-web.service=kodemeio-maintenance"
      # Catch-all fallback, HTTPS. TLS is served from the certificate Traefik
      # already holds for that SNI; HostRegexp yields no domain, so this router
      # never triggers an ACME request of its own.
      - "traefik.http.routers.kodemeio-maintenance-sec.rule=HostRegexp(`.+`)"
      - "traefik.http.routers.kodemeio-maintenance-sec.priority=1"
      - "traefik.http.routers.kodemeio-maintenance-sec.entrypoints=websecure"
      - "traefik.http.routers.kodemeio-maintenance-sec.service=kodemeio-maintenance"
      # ---------------------------------------------------------------------
      # Phase 2 — the `errors` middleware that converts a live-but-broken
      # app's 5xx into this same page. Defined HERE, on the always-up
      # container, so it still exists when the app that references it is gone.
      #
      # Inert on its own: a middleware changes nothing until a router names it.
      # A router that names it on a server WITHOUT this container is simply
      # dropped by Traefik, and the app's other router keeps serving — measured
      # 2026-09-08, the missing-middleware case returned the app's own response,
      # not a 404. That is what makes it safe to reference fleet-wide.
      #
      # Traefik preserves the upstream status, so a 500 stays a 500 and only
      # the body is replaced. Monitoring still sees a failure.
      # ---------------------------------------------------------------------
      - "traefik.http.middlewares.kodemeio-maintenance-errors.errors.status=500-504"
      - "traefik.http.middlewares.kodemeio-maintenance-errors.errors.service=kodemeio-maintenance"
      - "traefik.http.middlewares.kodemeio-maintenance-errors.errors.query=/"
      - "app=maintenance"
      - "app.component=fallback"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/maintenance-healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 64M
        reservations:
          cpus: '0.01'
          memory: 16M

configs:
  maintenance_nginx:
    content: |
      server {
          listen 80 default_server;
          server_name _;

          add_header Retry-After 30 always;
          add_header Cache-Control "no-store, no-cache, must-revalidate" always;
          add_header X-Maintenance "kodemeio-fallback" always;

          # Odoo JSON-RPC surface — the open SPA must get an error envelope it
          # understands, not an HTML page it will fail to parse.
          location ~ ^/(web/dataset|jsonrpc|longpolling|websocket) {
              default_type application/json;
              return 503 '{"jsonrpc":"2.0","id":null,"error":{"code":503,"message":"Service under maintenance","data":{"name":"maintenance","message":"Sistem sedang dalam pemeliharaan. Silakan coba lagi sebentar lagi."}}}';
          }

          # PWA / FastAPI surfaces: /sfa/api/... /wms/api/... /hrm/api/... /api/...
          location ~ ^/([a-z0-9_-]+/)?api/ {
              default_type application/json;
              return 503 '{"error":"maintenance","message":"Sistem sedang dalam pemeliharaan. Silakan coba lagi sebentar lagi.","message_en":"System under maintenance. Please try again shortly.","retry_after":30}';
          }

          # Liveness for the container's own healthcheck. Not a fleet health
          # endpoint — deliberately named so it cannot be mistaken for one.
          location = /maintenance-healthz {
              access_log off;
              return 200 "ok\n";
          }

          # Deploy state, read by the page. Default "unknown" on purpose: the
          # page then makes NO claim about WHY the system is down, which is the
          # only honest wording when it may be a crash rather than an update.
          # Saying "we are updating the system" during an outage is a lie the
          # users learn to distrust. Flip this to planned with an ETA only when
          # something actually knows a deploy is running.
          location = /maintenance-state.json {
              access_log off;
              default_type application/json;
              return 200 '{"mode":"unknown","expected_minutes":7}';
          }

          location = /maintenance.html {
              internal;
              root /usr/share/nginx/html;
          }

          location / {
              error_page 503 /maintenance.html;
              return 503;
          }
      }

  maintenance_html:
    content: |
      <!doctype html>
      <html lang="id">
      <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <meta name="robots" content="noindex">
      <meta http-equiv="refresh" content="90">
      <title>Sedang Pemeliharaan</title>
      <style>
        /* Kodemeio brand tokens, taken from kodemeio_theme/static/src/scss.
           Warm paper and graphite with a muted indigo accent, so this page looks
           like the system the reader just lost rather than a stranger's error page.
           System type stack on purpose: the app is down, and a webfont request
           would hang the one screen that has to appear instantly. */
        :root {
          color-scheme: light dark;
          --paper:  #faf9f6;
          --card:   #ffffff;
          --ink:    #3a3633;
          --soft:   #6f6960;
          --line:   #e8e3d9;
          --accent: #0176d3;
          --warn:   #a8621f;
          --track:  #ece7dd;
        }
        @media (prefers-color-scheme: dark) {
          :root {
            --paper:  #161513;
            --card:   #1d1c19;
            --ink:    #f0ece4;
            --soft:   #a9a298;
            --line:   #2a2823;
            --accent: #5eb0ea;
            --warn:   #e0a367;
            --track:  #2a2823;
          }
        }
        * { box-sizing: border-box; }
        html, body { margin: 0; }
        body {
          min-height: 100vh;
          background: var(--paper);
          color: var(--ink);
          font: 400 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
          -webkit-font-smoothing: antialiased;
          padding: clamp(28px, 7vh, 72px) clamp(20px, 6vw, 40px) 40px;
        }
        main { max-width: 34rem; margin: 0 auto; }
        @media (min-height: 640px) and (min-width: 700px) {
          body { display: grid; place-content: center; padding-bottom: clamp(28px, 7vh, 72px); }
          main { width: 34rem; }
        }

        /* Brand row — small, so it identifies without competing. */
        .brand { display: flex; align-items: center; gap: 10px; margin-bottom: clamp(28px, 6vh, 52px); }
        .mark {
          width: 26px; height: 26px; border-radius: 7px; background: var(--accent);
          display: grid; place-items: center; flex: none;
          color: #fff; font-weight: 700; font-size: 14px; letter-spacing: -.02em;
        }
        @media (prefers-color-scheme: dark) { .mark { color: #10171c; } }
        .wordmark { font-weight: 600; letter-spacing: -.01em; }
        .host {
          margin-left: auto; font-size: 12.5px; color: var(--soft);
          font-variant-numeric: tabular-nums; overflow: hidden; text-overflow: ellipsis;
          white-space: nowrap; max-width: 55%;
        }

        h1 {
          font-size: clamp(22px, 4.4vw, 30px); line-height: 1.22; font-weight: 600;
          letter-spacing: -.021em; margin: 0 0 28px;
        }

        /* The one bold element: how long it has been. That is the question the
           reader actually has, and a countdown that resets every 30s answers it
           worse than nothing. */
        .elapsed { display: flex; align-items: baseline; gap: 12px; }
        .count {
          font-size: clamp(52px, 13vw, 68px); line-height: .9; font-weight: 350;
          letter-spacing: -.045em; font-variant-numeric: tabular-nums;
        }
        .unit { font-size: 15px; color: var(--soft); }
        .bar { height: 3px; background: var(--track); border-radius: 2px; margin: 20px 0 10px; overflow: hidden; }
        .fill {
          height: 100%; width: 0%; background: var(--accent); border-radius: 2px;
          transition: width .8s linear;
        }
        .bar.over .fill { width: 100% !important; background: var(--warn); opacity: .55; }
        .note { font-size: 14px; color: var(--soft); margin: 0; }

        .assure {
          margin: 30px 0 0; padding-top: 24px; border-top: 1px solid var(--line);
          font-size: 17px; font-weight: 500;
        }
        .assure span { display: block; font-size: 15px; font-weight: 400; color: var(--soft); margin-top: 5px; }

        .meta { margin: 26px 0 0; font-size: 14px; color: var(--soft); }
        .en {
          margin: 22px 0 0; padding-top: 18px; border-top: 1px solid var(--line);
          font-size: 13px; color: var(--soft);
        }
        a { color: inherit; text-underline-offset: 3px; }
        a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 2px; }
        @media (prefers-reduced-motion: reduce) { .fill { transition: none; } }
      </style>
      </head>
      <body>
      <main>
        <div class="brand">
          <div class="mark" id="mark" aria-hidden="true"></div>
          <div class="wordmark" id="wordmark"></div>
          <div class="host" id="host"></div>
        </div>

        <h1 id="h">Sistem sedang tidak dapat diakses</h1>

        <div class="elapsed">
          <div class="count" id="count">0</div>
          <div class="unit" id="unit">menit</div>
        </div>
        <div class="bar" id="bar"><div class="fill" id="fill"></div></div>
        <p class="note" id="note">Biasanya selesai dalam beberapa menit.</p>

        <p class="assure">
          Data Anda aman.
          <span>Semua yang sudah Anda simpan tidak terpengaruh.</span>
        </p>

        <p class="meta" id="meta">Halaman ini kembali dengan sendirinya. Anda tidak perlu menutup atau memuat ulang.</p>

        <p class="meta" id="support" hidden></p>

        <p class="en" id="en">The system is temporarily unavailable. This page returns on its own once it is ready.</p>
      </main>

      <script>
      (function () {
        var el = {
          count: document.getElementById('count'), unit: document.getElementById('unit'),
          bar: document.getElementById('bar'), fill: document.getElementById('fill'),
          note: document.getElementById('note'), meta: document.getElementById('meta'),
          h: document.getElementById('h'), host: document.getElementById('host'),
          en: document.getElementById('en'), support: document.getElementById('support'),
          mark: document.getElementById('mark'), wordmark: document.getElementById('wordmark')
        };

        // Every instance is white-labelled to the TENANT, never to the vendor:
        // measured on prod 2026-09-08, brand_name is TPP / MAC / MAC HRMS / Helpdesk
        // and no instance carries a logo image. One container serves several hosts,
        // so the brand has to come from the hostname. Unknown hosts show no wordmark
        // rather than a wrong one.
        function brandFor(host) {
          host = (host || '').toLowerCase();
          if (host.indexOf('mac-odoo-hrms') === 0 || host.indexOf('mac-hrm') === 0) return 'MAC HRMS';
          if (host.indexOf('mac') === 0) return 'MAC';
          if (host.indexOf('helpdesk') === 0) return 'Helpdesk';
          // INFERRED, not measured: tpp-odoo-hrms has no tenant in odoo.yaml, so the
          // front door cannot read its brand. Mirrors the measured mac-odoo-hrms
          // ("MAC HRMS"). Verify and correct if it differs.
          if (host.indexOf('tpp-odoo-hrms') === 0 || host.indexOf('tpp-hrm') === 0) return 'TPP HRMS';
          if (host.indexOf('tpp') === 0 || host === 'idtpp.com') return 'TPP';
          return '';
        }
        window.__brandFor = brandFor;

        // Showing the host answers the doubt an outage creates: is this even our
        // system. It costs one line and removes a real reason to hesitate.
        try {
          var hostname = window.location.hostname;
          el.host.textContent = hostname;
          var brand = brandFor(hostname);
          if (brand) {
            el.wordmark.textContent = brand;
            el.mark.textContent = brand.charAt(0);
          } else {
            el.mark.hidden = true;
          }
        } catch (e) {}

        // Elapsed is measured from the FIRST view and survives the reloads this page
        // performs, so the number never resets to zero and understates the wait.
        var KEY = 'kodemeio-maint-since', since;
        try {
          since = parseInt(sessionStorage.getItem(KEY), 10);
          if (!since) { since = Date.now(); sessionStorage.setItem(KEY, String(since)); }
        } catch (e) { since = Date.now(); }

        var expected = 7, planned = false, until = '';

        function render() {
          var secs = Math.floor((Date.now() - since) / 1000);
          var mins = Math.floor(secs / 60);
          if (mins < 1) {
            el.count.textContent = secs;
            el.unit.textContent = 'detik berjalan';
          } else {
            el.count.textContent = mins;
            el.unit.textContent = 'menit berjalan';
          }
          var frac = Math.min(secs / (expected * 60), 1);
          el.fill.style.width = (frac * 100).toFixed(1) + '%';

          if (mins > expected) {
            el.bar.classList.add('over');
            // Past the expected window, say so. The anxiety is "is it stuck", not the
            // wait. No claim that anyone was alerted -- that is only true once
            // monitoring watches this host.
            el.note.innerHTML = 'Lebih lama dari biasanya. Jika terus berlanjut, hubungi tim IT.';
          } else {
            el.note.textContent = planned && until
              ? ('Pembaruan terjadwal, selesai sekitar pukul ' + until + '.')
              : ('Biasanya selesai dalam sekitar ' + expected + ' menit.');
          }
        }

        fetch('/maintenance-state.json', { cache: 'no-store' })
          .then(function (r) { return r.json(); })
          .then(function (st) {
            if (st && st.expected_minutes) { expected = st.expected_minutes; }
            // Only render a support line when a real channel is configured. A
            // "contact IT" with nowhere to go is worse than saying nothing.
            if (st && st.support_url && st.support_label) {
              var a = document.createElement('a');
              a.href = st.support_url; a.textContent = st.support_label;
              el.support.textContent = 'Butuh bantuan? ';
              el.support.appendChild(a);
              el.support.hidden = false;
            }
            if (st && st.mode === 'planned') {
              planned = true;
              until = st.until || '';
              el.h.textContent = 'Pemeliharaan terjadwal';
              el.en.textContent = 'Scheduled maintenance. This page returns on its own once it is done.';
            }
            render();
          })
          .catch(render);

        var left = 25 + Math.floor(Math.random() * 11);
        function tick() {
          render();
          if (left > 0) {
            el.meta.textContent = 'Halaman ini kembali dengan sendirinya. Memeriksa dalam ' + left + ' detik.';
            left -= 1;
            setTimeout(tick, 1000);
            return;
          }
          el.meta.textContent = 'Memeriksa…';
          fetch(window.location.href, { method: 'HEAD', cache: 'no-store', redirect: 'manual' })
            .then(function (r) {
              if (r.status !== 503) {
                try { sessionStorage.removeItem(KEY); } catch (e) {}
                window.location.reload();
                return;
              }
              left = 25 + Math.floor(Math.random() * 11);
              setTimeout(tick, 1000);
            })
            .catch(function () { left = 25 + Math.floor(Math.random() * 11); setTimeout(tick, 1000); });
        }
        render();
        setTimeout(tick, 1000);
      })();
      </script>
      </body>
      </html>

networks:
  dokploy-network:
    external: true
