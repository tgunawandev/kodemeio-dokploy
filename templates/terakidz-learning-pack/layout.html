<!doctype html>
<!--
  Terakidz learning pack -- the wkhtml layout source named by template.yaml (`layout`).

  The layout is a SKELETON, never content: it places {{blocks}} and pulls the brand from the
  kit, so the same file renders a Terakidz document and a Terakon document without a branch.
  Every {{...}} placeholder is one of the five namespaces template.v1 defines; a placeholder
  the renderer cannot supply refuses the import, so a typo can never reach a released PDF.

  Styling notes: wkhtmltopdf is the fleet's PDF engine (WebKit) -- no flexbox, no CSS grid.
  Page geometry is deliberately NOT declared here: the engine ignores the CSS `@page { size }`
  property, so the page box comes from the render options (template.v1 `page`, overridden by
  `options.page_size`/`options.orientation`, passed to the engine as --page-size/--orientation/
  --margin-*). Colours, radius and font families all come from {{theme.*}}, which the consumer
  resolves from the kit's verified font assets.
-->
<html lang="{{option.locale}}">
<head>
  <meta charset="utf-8"/>
  <title>{{var.pack_title}}</title>
  <style>
    html, body { margin: 0; padding: 0; }
    body {
      font-family: "{{theme.font_body}}", sans-serif;
      color: {{theme.foreground}};
      background: {{theme.background}};
      font-size: 12pt;
      line-height: 1.55;
    }
    .rule-band { height: 5mm; background: {{theme.primary}}; }
    .sheet { padding: 0 0 0 0; }
    h1, h2, h3 { font-family: "{{theme.font_heading}}", sans-serif; color: {{theme.primary}}; margin: 0 0 4mm 0; }
    h1 { font-size: 22pt; }
    h2 { font-size: 16pt; }
    h3 { font-size: 13pt; }
    p { margin: 0 0 4mm 0; }
    ol, ul { margin: 0 0 4mm 8mm; padding: 0; }
    li { margin: 0 0 2mm 0; }
    table { border-collapse: collapse; width: 100%; margin: 0 0 4mm 0; }
    th { background: {{theme.muted}}; color: {{theme.muted_foreground}}; text-align: left; }
    th, td { border: 1px solid {{theme.border}}; padding: 2mm; }
    .asset-box {
      border: 1mm dashed {{theme.accent}};
      border-radius: {{theme.radius}};
      background: {{theme.card}};
      color: {{theme.card_foreground}};
      padding: 8mm;
      text-align: center;
      margin: 0 0 4mm 0;
    }
    .asset-box .role { display: block; color: {{theme.muted_foreground}}; font-size: 9pt; }
    .disclaimer {
      background: {{theme.card}};
      color: {{theme.card_foreground}};
      border-left: 3mm solid {{theme.accent}};
      padding: 4mm;
      margin: 0 0 5mm 0;
    }
    .footer { color: {{theme.muted_foreground}}; font-size: 9pt; margin: 0 0 4mm 0; }
    .colophon {
      margin-top: 8mm;
      padding-top: 3mm;
      border-top: 1px solid {{theme.border}};
      color: {{theme.muted_foreground}};
      font-size: 8pt;
    }
  </style>
</head>
<body>
  <div class="rule-band"></div>
  <div class="sheet">
    {{blocks}}
    <div class="colophon">
      {{option.palette}} &middot; {{theme.font_heading}} &middot; {{theme.primary}} &middot; {{option.locale}}
    </div>
  </div>
</body>
</html>
