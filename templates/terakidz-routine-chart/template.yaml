# Terakidz routine chart — a free printable of the Terakidz product line B1 (Teracorp Track B, TB1).
#
# EXAMPLE CONTENT — not approved product copy. Claude-authored example copy (Track B TB-D9) in
# the Terakidz kit's voice; the named special-education reviewer and the founder replace it at
# the operational gate (ops/runbooks/teracorp-b1-terakidz-line.md). No medical claim, no promised
# outcome, no development timeline (the kit's `dont` rules; deploys/tests/test_terakidz_line.py).
#
# A blank visual schedule the adult fills in with the child's own steps: the sheet names no
# child and asks for no personal data, so nothing a family writes on it ever reaches the factory.
# Every asset reference is an `asset:<key>` already registered for the Terakidz sources (no new
# asset, no URL); the fonts are the kit's own (asset:font-nunito, OFL-1.1).
#
# Placeholders (contracts/templates/template.v1.schema.json): {{var.*}} declared variables,
# {{theme.*}} kit tokens, {{page.*}}, {{option.*}}, {{kit.*}} kit content, {{blocks}} (layout).
id: terakidz-routine-chart
version: 1
title: "Terakidz Routine Chart"
kind: pdf
renderer: wkhtml
layout: layout.html

page:
  size: A4
  orientation: portrait
  margins:
    top: 16
    right: 16
    bottom: 16
    left: 16

blocks:
  - type: heading
    level: 1
    text: "{{var.chart_title}}"
  - type: paragraph
    text: >-
      Jadwal bergambar untuk rutinitas {{var.routine_period}}. Tulis atau tempel satu gambar
      untuk setiap langkah, pasang di tempat yang mudah dilihat anak, lalu tunjuk langkahnya
      sebelum dikerjakan bersama.
  - type: table
    columns: ["Urutan", "Langkah (tulis atau tempel gambar)", "Sudah"]
    rows:
      - ["1", "", ""]
      - ["2", "", ""]
      - ["3", "", ""]
      - ["4", "", ""]
      - ["5", "", ""]
      - ["6", "", ""]
  - type: heading
    level: 2
    text: "Tips memakai jadwal"
  - type: list
    items:
      - "Mulai dari tiga langkah saja; tambahkan satu langkah setelah rutinitas terasa mudah."
      - "Pakai kata yang sama setiap hari untuk setiap langkah."
      - "Rayakan setiap langkah yang dicoba, bukan hanya yang selesai."
      - "Jika anak sedang menjalani terapi, tanyakan kepada terapisnya gambar atau simbol yang sebaiknya dipakai agar sejalan dengan tujuan terapi."
  - type: disclaimer
    text: "{{kit.disclaimers}}"
  - type: footer
    text: "Jadwal Rutinitas Terakidz — rutinitas {{var.routine_period}}"

variables:
  - key: chart_title
    type: string
    required: true
    default: "Jadwal Rutinitasku"
    description: "The chart's title as printed on the sheet."
  - key: routine_period
    type: enum
    enum: ["pagi", "siang", "sore", "malam"]
    required: true
    default: "pagi"
    description: "Which part of the day the chart is for (a variant axis)."

assets:
  fonts:
    heading: "asset:font-nunito"
    body: "asset:font-nunito"

outputs: [pdf]

# Terakidz content, approved for the Terakidz kit only: a kit not listed here refuses the
# render by name.
brand:
  kits: ["terakidz"]
