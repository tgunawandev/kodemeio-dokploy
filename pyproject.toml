[project]
name = "kodemeio-dokploy"
version = "0.1.0"
description = "Deployment desired state and operational tooling for the Kodemeio Dokploy fleet"
requires-python = ">=3.12"
dependencies = [
    "croniter>=6.2.4",
    "pyyaml>=6.0.2",
]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "jsonschema>=4.23",
    "pytest>=8.3.0",
    "ruff>=0.15.0",
]

[tool.pytest.ini_options]
testpaths = ["deploys/tests"]
addopts = ["--import-mode=importlib"]

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["docs/archive"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]
