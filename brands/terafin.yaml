# PLACEHOLDER — Terafin brand kit, DRAFT only (2026-09-28 Track B, slice K1).
#
# Terafin has no approved brand, voice or product yet. EVERY invented value below is marked
# `# PLACEHOLDER` and exists only so the factories can render financial-EDUCATION example
# content (Track B B11) under a real, schema-valid kit. Nothing here is approved brand content:
# status stays `draft` until a founder-approved Terafin brief exists and named finance educators
# are recorded as experts (an operational gate — `expert_logins` stays empty here).
#
# Two guards live in this file as DATA, never in the kernel:
#   1. the required `kit uji coba` ("trial kit") disclaimer — `factory.check.brand_rules`
#      refuses any artefact that omits a required disclaimer, so everything rendered under this
#      kit visibly says it is a trial brand;
#   2. the "no advice" law — the forbidden phrases below (claim shapes, never bare words: honest
#      education says "tidak dijamin", so bare `dijamin` is deliberately NOT forbidden) and the
#      required education disclaimer.
# Checked by deploys/tests/test_placeholder_kits.py.
code: terafin
version: 1
status: draft
brand: terafin
locale: id_ID

voice:
  summary: >
    PLACEHOLDER — no approved Terafin voice exists yet. Draft tone: calm, plain-language
    financial literacy for Indonesian households and small-business owners; explains concepts,
    never tells the reader what to buy, sell or hold.
  do:
    - "PLACEHOLDER: jelaskan konsep dengan contoh angka sederhana dan sebutkan risikonya."
