# dokploy.yaml — the inventory and write-guard table behind ./dokploy.sh.
#
# Single source of truth for platform -> kctl-dokploy profile, URL and health
# checks. Read by ./dokploy.sh and every tool in bin/dokploy/. It replaces the
# prose rules in CLAUDE.md ("Always pass an explicit profile", "Preview
# live-facing operations before applying them") with something a machine
# enforces: a rule a machine can check should never be a sentence in a document.
#
# The mechanism is vendored and identical across repos; everything specific to
# Dokploy is in this file.

service: dokploy
cli: kctl-dokploy
description: >-
  Dokploy deployment platform — desired state, infrastructure, monitoring and
  runbooks. CLI implementation lives in kodemeio-skills, not here.

# One leading word. Dokploy runs one control plane per platform, and each plane
# manages its own local/staging/production apps, so the environment is a
# manifest directory (deploys/instances/) and NOT a profile dimension.
selector: [platform]

targets:
  kodemeio: {profile: kodemeio, label: "Kodemeio platform",  url: "https://dokploy.kodeme.io"}
  idtpp:    {profile: idtpp,    label: "IDTPP platform",     url: "https://dokploy.idtpp.com"}
  abcfood:  {profile: abcfood,  label: "ABCFood platform",   url: "https://dokploy-hz.abcfood.app"}
  local:    {profile: local,    label: "Local Dokploy",      url: "http://localhost:3000"}

# `local` is the throwaway. Everything else is a live control plane that can
# stop other people's production containers, so guards apply there.
safe_targets: [local]

# Measured from `kctl-dokploy --help` on 2026-09-06. A global that takes a value
# must be listed under `value:` or the guard walk will mistake its VALUE for a
# verb and desync from the command it is meant to be guarding.
globals:
  value: [-p, --profile, -f, --format, --url, --api-key]
  bool:  [-q, --quiet, --json, --no-header, --debug, --no-cache, -V, --version]

# 🔴 kctl-dokploy owns a REAL --dry-run that previews a deployment against the
# live API. A bare --dry-run through this door is the door's OWN preview and is
# never forwarded; spell it --kctl-dry-run to reach the CLI's.
cli_has_dry_run: true

health:
  http_path: /
  sections:
    - status health
    - doctor ai-summary

# No bin/dokploy/ tool parses <platform> itself AND collides with a
# kctl-dokploy group name, so nothing is ambiguous in the group position yet.
# Add a name here only when both halves become true — see _dispatch.sh.
ambiguous: []

# Generated by scripts/frontdoor-guards from `kctl-dokploy commands tree`.
# Re-derive after a CLI upgrade; `frontdoor-guards verify` fails on a rotted entry.
guards:
  applications:
    _: [cancel, create, delete, deploy, move, redeploy, start, stop, update]
  certificates:
    _: [create, delete, import]
  compose:
    _: [cancel, create, delete, import, move, redeploy, start, stop, update]
    autodeploy: [disable, enable]
    backups: [create, delete, restore, rollback, update]
    deployments: [cancel, delete, kill, redeploy]
    domains: [create, delete, update]
    domains.move: [apply]
    env: [delete, push, set]
    mounts: [create, delete, update]
    patches: [create, delete, mark-delete, toggle, update]
    ports: [create, delete, update]
    redirects: [create, delete, update]
    schedules: [create, delete, update]
    security: [create, delete, update]
    volume-backups: [create, delete, restore, update]
  databases:
    _: [delete, deploy, stop]
  deploy:
    _: [apply, rollback]
    migrate: [apply, rollback]
  docker:
    _: [prune, restart]
  git:
    _: [create, delete, update]
  notifications:
    _: [create, delete, update]
  projects:
    _: [create, delete, update]
    environments: [create, delete, update]
  registry:
    _: [create, delete, update]
  servers:
    _: [create, delete, update]
  settings:
    _: [update]
  template:
    _: [apply, delete]
  traefik:
    file: [put]
  users:
    _: [create, delete, update]

# No verb in this CLI owns a --yes, so the door consumes the flag everywhere.
forward_yes: []
