profile: friday
principal: agent:friday
# Every repo here must also be on the broker's repo allowlist, DSH_BROKER_REPOS
# in kodemeio-dsh/.env.example (the broker refuses any other repo at create and
# load). deploys/tests/test_friday_broker_repos.py asserts this subset relation.
# kodemeio-hatchet and kodemeio-llmlite were added to both lists by ruling R3.
repos: [kodemeio-dokploy, kodemeio-next, kodemeio-react, kodemeio-odoo, kodemeio-hatchet, kodemeio-llmlite]
# Own LiteLLM key (kodemeio-llmlite config/keys.yaml alias `friday`,
# DeepSeek-only per design D5, max_budget = budget.llm_usd_per_day) -- never
# the interactive dsh UI's key, so budgets and kill switches stay separate.
model_route: litellm:friday
budget:
  llm_usd_per_day: 10
  wall_clock_minutes: 45
forbidden: [production_secrets, production_databases, merge, deploy]
pr:
  draft: true
  label: friday
