name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  repository:
    runs-on: ubuntu-latest
    env:
      # Read-only deploy key for the sibling checkout below: the private half of
      # a read-only deploy key registered on tgunawandev/kodemeio-dsh (GitHub
      # cannot mint personal tokens by API; a per-repo deploy key is narrower).
      # Without it this job FAILS loudly on purpose: test_friday_broker_repos
      # refuses to skip when CI=true and CI_GATES_REQUIRED_SIBLINGS names
      # kodemeio-dsh.
      HAS_DSH_READ_DEPLOY_KEY: ${{ secrets.DSH_READ_DEPLOY_KEY != '' }}
    defaults:
      run:
        # Sibling layout, as on a workstation: this repo and kodemeio-dsh sit
        # side by side under $GITHUB_WORKSPACE, so the tests' WORKSPACE_ROOT
        # (this repo's parent directory) finds ../kodemeio-dsh.
        working-directory: kodemeio-dokploy
    steps:
      - uses: actions/checkout@v4
        with:
          path: kodemeio-dokploy
          # Full history: the contracts backward-compatibility check compares
          # against the merge-base with origin/main (or HEAD~1), never HEAD.
          fetch-depth: 0

      # deploys/tests/test_friday_broker_repos.py reads
      # ../kodemeio-dsh/.env.example to check friday.yaml repos against
      # DSH_BROKER_REPOS.
      - uses: actions/checkout@v4
        if: env.HAS_DSH_READ_DEPLOY_KEY == 'true'
        with:
          repository: tgunawandev/kodemeio-dsh
          ssh-key: ${{ secrets.DSH_READ_DEPLOY_KEY }}
          persist-credentials: false
          path: kodemeio-dsh

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: kodemeio-dokploy/uv.lock

      - name: Install Python dependencies
        run: uv sync --locked

      - name: Unit tests
        env:
          # PRs compare contracts against the PR base; pushes fall back to
          # contracts_base_ref()'s merge-base / HEAD~1 logic.
          CONTRACTS_BASE_REF: ${{ github.event.pull_request.base.sha }}
          # Siblings that must be present: a missing one fails, never skips.
          CI_GATES_REQUIRED_SIBLINGS: kodemeio-dsh
        run: uv run pytest deploys/tests -q

      - name: App link QR tests
        run: uv run --with qrcode==8.2 --with pillow --with zxing-cpp pytest ops/app_links/tests -q

      - name: Operations tooling tests
        run: uv run pytest ops/scripts/tests -q

      - name: Python lint
        run: uv run ruff check deploys ops/scripts

      - name: Python formatting
        run: uv run ruff format --check deploys ops/scripts

      - name: Generator dry-run
        run: uv run python deploys/generate.py --dry-run

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Install pinned deployment client
        run: uv tool install "kctl-dokploy==0.16.6"

      - name: Validate all manifests offline
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            echo "::group::$file"
            kctl-dokploy --quiet \
              -p ci \
              --url http://127.0.0.1 \
              --api-key ci \
              deploy validate -f "$file"
            echo "::endgroup::"
          done < <(find deploys/instances -type f \( -name '*.yaml' -o -name '*.yml' \) | sort)

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform formatting
        run: terraform -chdir=infra fmt -check -recursive

      - name: Terraform initialization
        run: terraform -chdir=infra init -backend=false

      - name: Terraform validation
        run: terraform -chdir=infra validate
