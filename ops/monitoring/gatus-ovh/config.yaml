# MCP origin root intentionally returns 404; its API workers have host health checks.
storage:
  type: sqlite
  path: /data/data.db
  maximum-number-of-results: 10
  maximum-number-of-events: 10
security:
  basic:
    username: ${GATUS_BASIC_USERNAME}
    password-bcrypt-base64: ${GATUS_BASIC_PASSWORD_HASH}
endpoints:
- name: authentik
  group: identity
  url: https://auth.kodeme.io/-/health/live/
  interval: 60s
  conditions:
  - '[STATUS] == 200'
  - '[CERTIFICATE_EXPIRATION] > 168h'
- name: odoo-erp
  group: odoo
  url: https://erp.kodeme.io/web/health
  interval: 60s
  conditions:
  - '[STATUS] == 200'
  - '[CERTIFICATE_EXPIRATION] > 168h'
- name: odoo-desk
  group: odoo
  url: https://desk.kodeme.io/web/health
  interval: 60s
  conditions:
  - '[STATUS] == 200'
  - '[CERTIFICATE_EXPIRATION] > 168h'
- name: mattermost
  group: chat
  url: https://mm.kodeme.io/api/v4/system/ping
  interval: 60s
  conditions:
  - '[STATUS] == 200'
  - '[CERTIFICATE_EXPIRATION] > 168h'
- name: glitchtip
  group: monitoring
  url: https://glitchtip.kodeme.io/_health/
  interval: 60s
  conditions:
  - '[STATUS] == 200'
  - '[CERTIFICATE_EXPIRATION] > 168h'
- name: dokploy
  group: infrastructure
  url: https://dokploy.kodeme.io/
  interval: 60s
  conditions:
  - '[STATUS] == 200'
  - '[CERTIFICATE_EXPIRATION] > 168h'
- name: odoo-hris
  group: odoo
  url: https://hris.kodeme.io/web/health
  interval: 60s
  conditions:
  - '[STATUS] == 200'
  - '[CERTIFICATE_EXPIRATION] > 168h'
- name: desk-links
  group: odoo
  url: https://go.desk.kodeme.io/
  interval: 60s
  conditions:
  - '[STATUS] == 200'
  - '[CERTIFICATE_EXPIRATION] > 168h'
- name: weknora
  group: knowledge
  url: https://weknora.kodeme.io/
  interval: 60s
  conditions:
  - '[STATUS] == 200'
  - '[CERTIFICATE_EXPIRATION] > 168h'
- name: weknora-mcp-origin
  group: knowledge
  url: https://weknora-mcp.kodeme.io/
  interval: 60s
  conditions:
  - '[STATUS] == 404'
  - '[CERTIFICATE_EXPIRATION] > 168h'
  client:
    ignore-redirect: true
- name: gatus
  group: monitoring
  url: https://gatus.kodeme.io/health
  interval: 60s
  conditions:
  - '[STATUS] == 200'
  - '[CERTIFICATE_EXPIRATION] > 168h'
- name: immich
  group: owner-services
  url: https://immich.kidneuro.io/api/server/ping
  interval: 60s
  conditions:
  - '[STATUS] == 200'
  - '[CERTIFICATE_EXPIRATION] > 168h'
- name: portfolio
  group: owner-services
  url: https://trigunawan.com/
  interval: 60s
  conditions:
  - '[STATUS] == 200'
  - '[CERTIFICATE_EXPIRATION] > 168h'
- name: legacy-hatchet
  group: legacy
  url: https://hatchet.kodeme.io/
  interval: 60s
  conditions:
  - '[STATUS] == 200'
  - '[CERTIFICATE_EXPIRATION] > 168h'
