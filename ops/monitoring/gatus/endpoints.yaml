# 🔴 THIS FILE IS NOT WHAT GATUS READS. Measured 2026-09-08.
#
# `deploys/instances/production/kod-infra-gatus.yaml` sets
# `source_overrides: repo: kodemeio-gatus`, so the running Gatus takes its
# config from the SEPARATE `kodemeio-gatus` repository (last updated
# 2026-04-02). This file is a documentation copy that nothing applies.
#
# `ops/monitoring/scripts/apply-monitoring.sh` would apply it, but the CLI it
# needs does not exist: `kctl-gatus` is absent from PyPI and from
# kodemeio-skills/packages/. So the monitoring-as-code loop was never closed.
#
# That is why this file drifted to six Odoo hostnames with NO DNS AT ALL,
# asserting a body of "pass" that a real /web/health never returns, while not
# one live production instance was monitored. Nothing applied it and nothing
# checked it. A tpp-odoo-erp production outage on 2026-09-08 was found by a
# person looking at a browser tab.
#
# Fixing monitoring for real means editing `kodemeio-gatus`, or wiring this
# file to something that applies it. The corrected endpoints below are right,
# and until one of those happens they change nothing.

# Gatus Endpoint Configuration
# Kodemeio Platform — All monitored services
#
# This file defines all health check endpoints for the Gatus uptime monitor.
# Gatus reads its own config.yaml on the server; this file serves as the
# source-of-truth for what SHOULD be configured.
#
# Gatus config path (on server): /config/config.yaml
# Docs: https://gatus.io/docs

# ---------------------------------------------------------------------------
# Odoo Instances
# ---------------------------------------------------------------------------
endpoints:
  # -- Odoo: idtpp.com (the live production fleet) --
  # Verified 2026-09-08: every host below returns 200 with body "ok".
  # The six entries previously here (odoo.kodeme.io, odoo.mandiriagro.com,
  # odoo.pakerti.com and their -hrms twins) had NO DNS AT ALL and asserted
  # [BODY] == pass, so they were broken twice over and could never pass.
  # Result: no production Odoo instance was monitored, and the permanent
  # failures trained everyone to ignore Gatus.

  - name: "Odoo TPP ERP (production)"
    group: "odoo"
    url: "https://tpp-odoo-erp.idtpp.com/web/health"
    interval: 60s
    conditions:
      - "[STATUS] == 200"
      - "[BODY] == ok"
      - "[RESPONSE_TIME] < 5000"
    alerts:
      - type: telegram
        enabled: true
        failure-threshold: 3
        success-threshold: 2

  - name: "Odoo TPP HRMS (production)"
    group: "odoo"
    url: "https://tpp-odoo-hrms.idtpp.com/web/health"
    interval: 60s
