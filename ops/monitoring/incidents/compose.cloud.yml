# Review candidate: deploy through Dokploy on a human-selected monitoring host.
# Same collector, Gatus and GlitchTip versions as the accepted local pilot.
# This runs evidence collection only; it does not invoke agents or modify Desk.
name: kod-incident-monitoring

x-collector: &collector
  image: ${INCIDENT_IMAGE:?reviewed collector image pinned by digest required}
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: [/tmp]
  volumes:
    - incident-state:/state
    - ./services.cloud.json:/config/services.json:ro
  deploy:
    resources:
      limits: {memory: 256M, cpus: '0.5'}

services:
  incident-ingress:
    <<: *collector
    environment:
      INCIDENT_STATE: /state/incidents.db
      INCIDENT_SERVICES: /config/services.json
      INCIDENT_GATUS_TOKEN: ${INCIDENT_GATUS_TOKEN:?required}
      INCIDENT_GLITCHTIP_TOKEN: ${INCIDENT_GLITCHTIP_TOKEN:?required}
      INCIDENT_READ_TOKEN: ${INCIDENT_READ_TOKEN:?required}
    networks: [dokploy-network, evidence]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3

  incident-collector:
    <<: *collector
    command: [python, -m, incident_triage, loop]
    environment:
      INCIDENT_STATE: /state/incidents.db
      INCIDENT_SERVICES: /config/services.json
      INCIDENT_GLITCHTIP_READ_TOKEN: ${INCIDENT_GLITCHTIP_READ_TOKEN:?scoped read identity required}
    networks: [evidence, egress]
    depends_on:
      incident-ingress: {condition: service_healthy}
      glitchtip: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -m, incident_triage, health]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  gatus:
    image: ghcr.io/twin/gatus:v5.37.0
    restart: unless-stopped
    environment:
      INCIDENT_GATUS_TOKEN: ${INCIDENT_GATUS_TOKEN:?required}
      GATUS_TELEGRAM_TOKEN: ${GATUS_TELEGRAM_TOKEN:?preserve existing alert channel}
      GATUS_TELEGRAM_CHAT_ID: ${GATUS_TELEGRAM_CHAT_ID:?required}
      GATUS_SMTP_FROM: ${GATUS_SMTP_FROM:-Kodemeio Monitor <ops@kodeme.io>}
      GATUS_SMTP_USER: ${GATUS_SMTP_USER:?required}
      GATUS_SMTP_PASS: ${GATUS_SMTP_PASS:?required}
      GATUS_SMTP_HOST: ${GATUS_SMTP_HOST:-mail.kodeme.io}
      GATUS_ALERT_TO: ${GATUS_ALERT_TO:?required}
    volumes:
      - ./gatus.cloud.json:/config/config.yaml:ro
      - gatus-data:/data
    networks: [evidence, egress]
    deploy:
      resources:
        limits: {memory: 256M, cpus: '0.5'}

  heartbeat:
    image: alpine:3.20
    restart: unless-stopped
    command: [sh, /heartbeat.sh]
    environment:
      HC_GATUS_URL: ${HC_GATUS_URL:?external dead-man check required}
      GATUS_HEALTH_URL: http://gatus:8080/health
      HEARTBEAT_INTERVAL: '60'
    volumes: ['../gatus/heartbeat.sh:/heartbeat.sh:ro']
    depends_on: [gatus]
    networks: [evidence, egress]
    healthcheck:
      test: [CMD-SHELL, 'test -n "$$(find /tmp/heartbeat.ok -mmin -3 2>/dev/null)"']
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 90s
    deploy:
      resources:
        limits: {memory: 32M, cpus: '0.1'}

  glitchtip:
    image: glitchtip/glitchtip:6.2.6@sha256:a3d8eb1b36c1e1603d55ab32711ea3dd8115874742a781a57391a62a16e0dff6
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://incident:${GLITCHTIP_DB_PASSWORD:?required}@glitchtip-db:5432/incident
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY:?required}
      GLITCHTIP_DOMAIN: ${GLITCHTIP_DOMAIN:?approved HTTPS hostname required}
      ALLOWED_HOSTS: ${GLITCHTIP_ALLOWED_HOSTS:?approved hostname plus localhost required}
      PORT: '8000'
      SERVER_ROLE: all_in_one
      VALKEY_URL: ''
      GLITCHTIP_ENABLE_UPTIME: 'False'
      GLITCHTIP_ENABLE_MCP: 'False'
      GLITCHTIP_ALLOW_PRIVATE_IPS: 'False'
      ENABLE_USER_REGISTRATION: 'False'
      ENABLE_ORGANIZATION_CREATION: 'False'
      EMAIL_URL: ${GLITCHTIP_EMAIL_URL:?approved SMTP configuration required}
      GLITCHTIP_RETENTION_DAYS: '30'
      MEDIA_ROOT: /data
    volumes: [glitchtip-files:/data]
    networks: [dokploy-network, evidence, egress]
    depends_on:
      glitchtip-db: {condition: service_healthy}
      glitchtip-files-init: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/_health/')"]
      interval: 30s
      timeout: 10s
      retries: 12
      start_period: 90s
    deploy:
      resources:
        limits: {memory: 768M, cpus: '1'}

  glitchtip-files-init:
    image: glitchtip/glitchtip:6.2.6@sha256:a3d8eb1b36c1e1603d55ab32711ea3dd8115874742a781a57391a62a16e0dff6
    user: '0:0'
    command: [python, -c, "import os; os.chmod('/data',0o700); os.chown('/data',5000,5000)"]
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER]  # repeat setup can chmod the existing uid-5000 volume
    security_opt: [no-new-privileges:true]
    network_mode: none
    volumes: [glitchtip-files:/data]
    deploy:
      resources:
        limits: {memory: 64M, cpus: '0.25'}

  glitchtip-db:
    image: postgres:16.10-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: incident
      POSTGRES_DB: incident
      POSTGRES_PASSWORD: ${GLITCHTIP_DB_PASSWORD:?required}
    volumes: [glitchtip-data:/var/lib/postgresql/data]
    networks: [evidence]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U incident -d incident']
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits: {memory: 256M, cpus: '0.5'}

volumes:
  incident-state:
  gatus-data:
  glitchtip-data:
  glitchtip-files:

networks:
  dokploy-network: {external: true}
  evidence: {internal: true}
  egress: {}
