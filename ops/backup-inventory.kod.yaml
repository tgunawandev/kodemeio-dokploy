# kod estate — stateful backup inventory (Teracorp Wave 0, Task 3).
#
# Desired-state description of what backs up what: every stateful service on
# the kod estate (kod-prod-01, kod-prod-02, abc-prod-01, abc-prod-02), where
# its PRIMARY backup lands (Hetzner Object Storage, "kodemeio" project), and
# where the OFFSITE copy lands (Backblaze B2, bucket kod-prod-backup).
#
# This file is the desired state; kodemeio-skills' docker/jobs/kod-*.sh are
# the code that actually runs. deploys/tests/test_backup_inventory.py reads
# both and fails on drift: a prefix or threshold changed in a job but not
# here (or vice versa) stops silently, before a restore ever needs it.
#
# Facts below are from Task 0 (verify-first, read-only, profile kodemeio,
# 2026-09-26) and the job scripts Task 2 shipped in kodemeio-skills
# (docker/jobs/kod-offsite-mirror.sh, kod-offsite-fresh.sh, kod-hz-fresh.sh).
# The flat prefix layout (e.g. `kodemeio-postgres-backup/kod_odoo_erp/`, no
# extra directory segment) is what Task 0 actually found for kod — other
# estates in this workspace nest an extra compose-path directory; kod does
# not.
#
# Schema:
#   id        unique
#   kind      odoo-db | odoo-filestore | pg-db | filestore | bucket | app-dump | gap
#   pair      required for odoo-db/odoo-filestore; must point back
#   primary   {bucket, prefix, cadence_h} — where the primary backup lands,
#             or the literal string "provider" when a third party runs it
#   offsite   {bucket, prefix} — where the B2 offsite copy lands
#   fresh_h   max age (hours) before the freshness alarm fires; must equal
#             the job scripts exactly
#   drill     odoo | authentik | none — which restore drill covers it
#   (kind: filestore -- Task 6: a non-Odoo volume/attachment tar backup, e.g.
#    Authentik media or Mattermost file attachments. Unlike odoo-filestore it
#    has no `pair` requirement, but it IS fresh-eligible: both freshness jobs
#    must carry a matching entry, same as odoo-db/odoo-filestore/pg-db.)
#   planned   true when the jobs deliberately do not cover this item yet;
#             excluded from the drift/equality tests; requires `notes`
#             naming the task or event that adds it
#   notes     free text; required when planned is true

version: 1
estate: kod

items:
  # --- Odoo: erp / hrms / desk, each a DB + filestore pair --------------------

  - id: odoo-erp-db
    kind: odoo-db
    pair: odoo-erp-filestore
    primary:
      bucket: kodemeio-postgres-backup
      prefix: kod_odoo_erp/
      cadence_h: 12
    offsite:
      bucket: kod-prod-backup
      prefix: kodemeio-postgres-backup/kod_odoo_erp/
    fresh_h: 30
    drill: odoo
    notes: "Teracorp companies live here (erp.kodeme.io, abc-prod-02)"

  - id: odoo-erp-filestore
    kind: odoo-filestore
    pair: odoo-erp-db
    primary:
      bucket: kodemeio-odoo-filestore
      prefix: kod-odoo-erp/snapshots/
      cadence_h: 2
    offsite:
      bucket: kod-prod-backup
      prefix: kodemeio-odoo-filestore/kod-odoo-erp/snapshots/
    fresh_h: 8
    drill: odoo

    notes: "Wave 0 Task 5 (2026-09-26): kod-odoo-erp-filestore-backup manifest generated (deploys/instances/production/), restic tag kod-odoo-erp under kodemeio-odoo-filestore -- matches primary.prefix. min_files is a SEED (1); founder gate G5 deploys it and sets the real floor from the first measured files=N. Not live until G5 runs."
  - id: odoo-hrms-db
    kind: odoo-db
    pair: odoo-hrms-filestore
    primary:
      bucket: kodemeio-postgres-backup
      prefix: kod_odoo_hrms/
      cadence_h: 12
    offsite:
      bucket: kod-prod-backup
      prefix: kodemeio-postgres-backup/kod_odoo_hrms/
    fresh_h: 30
    drill: odoo
    notes: "Task 0 (2026-09-26): dump cron stale ~223h, only one dump ever taken -- a live production gap, flagged to the founder, tracked outside Wave 0. The job/threshold still alarm on it correctly; not marked planned."

  - id: odoo-hrms-filestore
    kind: odoo-filestore
    pair: odoo-hrms-db
    primary:
      bucket: kodemeio-odoo-filestore
      prefix: kod-odoo-hrms/snapshots/
      cadence_h: 2
    offsite:
      bucket: kod-prod-backup
      prefix: kodemeio-odoo-filestore/kod-odoo-hrms/snapshots/
    fresh_h: 8
    drill: odoo

    notes: "Wave 0 Task 5 (2026-09-26): kod-odoo-hrms-filestore-backup manifest generated (deploys/instances/production/), restic tag kod-odoo-hrms under kodemeio-odoo-filestore -- matches primary.prefix. min_files is a SEED (1); founder gate G5 deploys it and sets the real floor from the first measured files=N. Not live until G5 runs."
  - id: odoo-desk-db
    kind: odoo-db
    pair: odoo-desk-filestore
    primary:
      bucket: kodemeio-postgres-backup
      prefix: kod_odoo_desk/
      cadence_h: 12
    offsite:
      bucket: kod-prod-backup
      prefix: kodemeio-postgres-backup/kod_odoo_desk/
    fresh_h: 30
    drill: odoo

  - id: odoo-desk-filestore
    kind: odoo-filestore
    pair: odoo-desk-db
    primary:
      bucket: kodemeio-odoo-filestore
      prefix: kod-odoo-desk/snapshots/
      cadence_h: 2
    offsite:
      bucket: kod-prod-backup
      prefix: kodemeio-odoo-filestore/kod-odoo-desk/snapshots/
    fresh_h: 8
    drill: odoo

  # --- Other live databases ---------------------------------------------------

  - id: authentik-db
    kind: pg-db
    primary:
      bucket: kodemeio-postgres-backup
      prefix: authentik/
      cadence_h: 12
    offsite:
      bucket: kod-prod-backup
      prefix: kodemeio-postgres-backup/authentik/
    fresh_h: 30
    drill: authentik
    notes: "Task 0 (H2): Authentik's live DB is kod-postgres (external/shared), not the compose file's embedded default -- already covered by this kod postgres dump prefix. Not a gap; Authentik MEDIA is (see authentik-media below)."

  - id: mattermost-db
    kind: pg-db
    primary:
      bucket: kodemeio-mattermost-backup
      prefix: mattermost/daily/
      cadence_h: 24
    offsite:
      bucket: kod-prod-backup
      prefix: kodemeio-mattermost-backup/mattermost/daily/
    fresh_h: 30
    drill: none

  - id: hatchet-db
    kind: pg-db
    primary:
      bucket: kodemeio-hatchet-backup
      prefix: db/
      cadence_h: 24
    offsite:
      bucket: kod-prod-backup
      prefix: kodemeio-hatchet-backup/db/
    fresh_h: 30
    drill: none

  # --- App-managed backup, not covered by the kod jobs ------------------------

  - id: supabase-terakidz
    kind: app-dump
    primary: provider
    offsite:
      bucket: kod-prod-backup
      prefix: supabase/terakidz/
    fresh_h: 800
    drill: none
    notes: "TeraKidz production = Supabase Cloud, ref etxfaitkiscjusjfzpuo (kodemeio-supabase supabase.yaml target terakidz/cloud; no self-hosted production exists). Primary = Supabase's own provider backups (tier H5, recorded in ops/runbooks/supabase-export.md). Offsite = founder-run ops/scripts/supabase-export.sh into kod-prod-backup/supabase/terakidz/<stamp>/ (G10), monthly pre-launch; set fresh_h to 192 when it goes weekly. Not covered by the kod-* jobs."

  # --- Filestore/media, non-Odoo (Task 6) -------------------------------------

  - id: authentik-media
    kind: filestore
    primary:
      bucket: kodemeio-authentik-backup
      prefix: media/
      cadence_h: 24
    offsite:
      bucket: kod-prod-backup
      prefix: kodemeio-authentik-backup/media/
    fresh_h: 30
    drill: authentik
    notes: "Teracorp Wave 0 Task 6 (2026-09-26): tar of the authentik-data Docker volume (docker-compose.prod.yml, abc-prod-02), via backup/backup.sh's `media` path in kodemeio-authentik. Authentik's DATABASE is on kod-postgres, already covered by authentik-db above -- this item is the media-only gap R2 called for. The same script's DB-dump path stays behind BACKUP_DB=0 in prod (dormant, for the future embedded/self-contained variant); not represented here since it does not run. FOUNDER ACTION (fix round 1, 2026-09-26): (1) the `kodemeio-authentik-backup` bucket does not exist yet in Hetzner -- must be provisioned (with S3_BACKUP_* credentials wired into Dokploy env) before this sidecar's uploads can land anywhere; (2) confirm the LIVE value of AUTHENTIK_STORAGE_BACKEND on auth.kodeme.io -- the compose file's own default is `s3` (not `file`), and the sidecar now refuses with reason=media_in_s3 when it sees that value, since the real media then lives in Authentik's own S3 bucket (AUTHENTIK_STORAGE__MEDIA__S3__BUCKET_NAME, default kodemeio-authentik-data) instead of this volume. If the live value is `s3`, this item should track THAT bucket in the kod offsite mirror, not the authentik-data volume -- gap re-opens until confirmed. ORDERING (final review I3, 2026-09-27): the compose renders the four S3_BACKUP_* values as EMPTY until step (1) is done, because `${…:?…}` would have made the LIVE SSO stack undeployable for that whole window (any redeploy, incl. an autoDeploy from a merge, failed at compose render). The sidecar therefore fails closed instead: with an empty value it logs `FATAL: refusing to run -- required setting(s) empty: …` and exits 78, so 'not provisioned yet' is a stopped backup with a loud log, never a green one. tests/test_backup.bats and .github/workflows/validate.yml pin both halves."

  - id: mattermost-files
    kind: filestore
    primary:
      bucket: kodemeio-mattermost-backup
      prefix: mattermost/files/
      cadence_h: 24
    offsite:
      bucket: kod-prod-backup
      prefix: kodemeio-mattermost-backup/mattermost/files/
    fresh_h: 30
    drill: none
    notes: "Teracorp Wave 0 Task 6 (2026-09-26): tar of the mm-data Docker volume (docker-compose.prod.yml, abc-prod-02) via the new mm-files-backup sidecar, reusing kodemeio-mattermost/backup/backup.sh's existing image and pattern (files/files-once modes added alongside the existing DB backup/loop modes). Same bucket as mattermost-db, already covered by kod-offsite-mirror.sh's existing kodemeio-mattermost-backup/mattermost b2_sync (whole prefix tree) -- no new mirror source needed. FOUNDER ACTION (fix round 1, 2026-09-26): unlike authentik-media, this does NOT need a new bucket -- it reuses the already-provisioned `kodemeio-mattermost-backup` bucket and the same S3_BACKUP_* credentials the existing mm-backup (DB) sidecar already has in Dokploy env. The founder does need to redeploy this compose so the new mm-files-backup service actually starts -- committing the file alone does not run it. 🔴 UNVERIFIED PREMISE (final review I2, 2026-09-27): this item treats mm-data as the attachment store, which is true only when MM_FILESETTINGS_DRIVERNAME is `local` -- Task 0 inferred that value and never read it, and docker-compose.prod.yml's own default is `amazons3` with an empty bucket. G6 step 4 confirms name+value and, if it is `amazons3`, adds THAT bucket to kod-offsite-mirror.sh + this inventory instead, because the volume then holds no attachments at all. The sidecar's FILES_MIN_FILES floor (fix round 1: seed 1, raised to 90% of the first measured files=N) makes the failure loud -- RESULT=FAILED files=0, nothing uploaded, both freshness checks stay red -- rather than a green backup of an empty volume."

  # --- Planned: the jobs deliberately do not cover these yet ------------------
  # (excluded from the drift/equality tests; each names the task/event that
  # adds it)

  - id: litellm-db
    kind: gap
    planned: true
    notes: "LiteLLM is not deployed on kod (Task 0: kodemeio-postgres-backup/litellm/ has had zero objects, ever; no kod-infra-litellm compose; no llm.kodeme.io DNS record). Re-add as a pg-db item (and to both freshness jobs) when LiteLLM ships."

  - id: postgres-gatus-glitchtip
    kind: gap
    planned: true
    notes: "Final review M9: kod postgres' SERVICE_DATABASES carries `gatus` and `glitchtip` (Task 0 F3), so the postgres dump job writes them under kodemeio-postgres-backup/ and the whole-bucket b2_sync mirrors them incidentally -- but neither has its own inventory item, freshness entry, or restore path. Deliberately left as a gap: Task 0 found neither service deployed on kod (gatus/glitchtip have no licence, no URLs in the estate) and both are disposable if they ever ship (dashboard state / error-feed buffer), which is why this is `planned` rather than a stale-alarm source. Promote to pg-db items (and add both freshness prefixes) in the same change that deploys them."

  # --- Gaps: no backup, no task assigned yet ----------------------------------

  - id: mattermost-config
    kind: gap
    notes: "Mattermost config.json plus plugins live in the mm-config / mm-plugins / mm-client-plugins Docker volumes (abc-prod-02), regenerated from env vars only in part -- Task 0 judged MM_CONFIG_REBUILDABLE=no. No backup path exists yet; out of scope for Wave 0."

  - id: dokploy-control-plane
    kind: gap
    notes: "No dedicated backup job for Dokploy's own Postgres/control-plane DB. Task 0 (bonus finding): the kodemeio-backups bucket already holds a daily 'webserver-backup' zip (Dokploy's own file/webserver backup feature), but it is unconfirmed whether that includes the Dokploy DB itself -- treat as a lead, not a closed gap. Out of scope for Wave 0 (spec section 8)."

  - id: hermes-state
    kind: gap
    notes: "Hermes's local/agent state has no backup job or S3 bucket anywhere in this estate. Out of scope for Wave 0."

  - id: dsh-home
    kind: gap
    notes: "dsh's home/data directory on kod-prod-02 has no backup job or S3 bucket anywhere in this estate. Out of scope for Wave 0."

  - id: mailcow
    kind: gap
    notes: "Mailcow (abc-prod-01) has no backup job or S3 bucket in this estate; Task 0 shows abc-prod-01 at totalSum: 0 compose/apps in Dokploy, i.e. not even tracked there. Out of scope for Wave 0."
